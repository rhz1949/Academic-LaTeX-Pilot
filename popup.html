<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overleaf Intelligent Translator</title>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 12px;
      width: 260px;
      background: #fafafa;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px 0;
      color: #333;
    }
    label {
      display: block;
      font-size: 12px;
      color: #555;
      margin-bottom: 4px;
    }
    select, input {
      width: 100%;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #3e9a6e;
      border: none;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #35845e;
    }
    .status {
      margin-top: 8px;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>AI Translator Settings</h1>
  <label for="provider">Provider</label>
  <select id="provider">
    <option value="gemini">Gemini</option>
    <option value="openai">OpenAI</option>
  </select>

  <label for="api-key">API Key</label>
  <input id="api-key" type="password" placeholder="Enter API key" />

  <button id="save-btn">Save</button>
  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
